[project]
name = "py-ddd-framework"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.141.1",
    "msgpack>=1.2.2",
    "orjson>=3.12.0",
    "redis>=8.1.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "asyncpg>=0.31.0",
    "sqlalchemy>=2.0.54",
]
rabbit = [
    "faststream[rabbit]>=0.7.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]
docs = [
    "mkdocs-material>=9.7.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 110

extend-exclude = [
    "cli",
    "migrations",
    "migration",
    "src/migrations",
    "alembic.ini",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.venv",
]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle
    "W",
    "C90",    # mccabe
    "I",      # isort
    "N",      # naming
    "UP",     # pyupgrade
    "ASYNC",  # async correctness
    "FAST",   # FastAPI
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RET",    # return statements
    "SIM",    # simplification
    "ARG",    # unused arguments
    "PL",     # pylint
    "PERF",   # performance
    "RUF",    # Ruff
    "LOG",    # logging
]

ignore = [
    # pytest / testing
    "S101",

    # Sometimes useful in framework/application code
    "ARG001",

    # Python allows this and it is often useful in adapters
    "PLC0415",

    # Relative imports are sometimes useful inside modules
    "TID252",

    # Unicode is valid and common in Russian comments/docstrings
    "RUF001",
    "RUF002",
    "RUF003",

    # Async functions without timeout are sometimes legitimate
    "ASYNC109",

    # Existing project conventions
    "N805",
    "PLW3201",
    "PLW1641",

    # Too opinionated for this codebase
    "TRY003",
]


[tool.ruff.lint.isort]
section-order = [
    "future",
    "typing",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"typing" = ["typing"]


[tool.ruff.lint.pylint]
max-args = 15
max-returns = 10
max-branches = 30


[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",
    "ARG001",
    "F401",
    "PLR6301",
]

"migrations/**/*" = [
    "S101",
    "ARG001",
    "F401",
    "PLR6301",
    "I001",
    "ERA001",
]

"**/*crud.py" = [
    "RUF029",
    "ARG001",
]

"**/crud/**/*.py" = [
    "RUF029",
    "ARG001",
]


# ---------------------------------------------------------------------------
# Ruff formatter
# ---------------------------------------------------------------------------

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true


# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

exclude = [
    "src/migration",
    "src/migrations",
    "__samples__",
    ".venv",
]


# ---------------------------------------------------------------------------
# Vulture
# ---------------------------------------------------------------------------

[tool.vulture]
exclude = [
    ".vscode/",
    "__samples__/",
    "tests/",
    ".venv/",
]

ignore_names = [
    "post",
    "put",
    "delete",
    "head",
]
