site_name: DDF
site_description: Pythonic building blocks for domain-driven applications
site_url: https://example.invalid/ddf
repo_name: py-ddd-framework

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Начало: index.md
  - Быстрый старт:
      - Установка: getting-started/installation.md
      - За 15 минут: getting-started/quickstart.md
      - Структура проекта: getting-started/project-structure.md
  - Концепции:
      - Архитектура: concepts/architecture.md
      - Сущности и Value Object: concepts/entities.md
      - Репозитории и Unit of Work: concepts/persistence.md
      - Доменные события: concepts/events.md
  - Возможности:
      - CRUD-сервис: features/crud.md
      - Фильтрация DSL: features/dsl.md
      - Пагинация и сортировка: features/pagination.md
      - Кэширование: features/caching.md
      - SQLAlchemy: features/sqlalchemy.md
  - Рецепты:
      - DSL в FastAPI: recipes/dsl-endpoint.md
      - Репозиторий с кэшем: recipes/cached-repository.md
  - Архитектурные решения:
      - ADR: decisions/index.md
      - '0001: UUIDv7': decisions/0001-use-uuidv7.md
      - '0002: Pythonic DDD': decisions/0002-pythonic-ddd.md
      - '0003: Data Mapper': decisions/0003-data-mapper.md
      - '0004: Публикация событий': decisions/0004-events-after-commit.md
