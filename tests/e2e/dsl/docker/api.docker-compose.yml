services:
  api:
    build:
      context: ../../../..
      dockerfile: tests/e2e/dsl/docker/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ddf
      POSTGRES_PASSWORD: dsl-e2e-secret
      POSTGRES_DB: ddf
    ports:
      - "18121:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
