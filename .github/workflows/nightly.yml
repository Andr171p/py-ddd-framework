name: Nightly

on:
  schedule:
    # 02:00 UTC+5
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  NO_PROXY: 127.0.0.1,localhost

jobs:
  e2e:
    name: Nightly E2E
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  load-realtime:
    name: Load Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --locked --group test --extra redis --extra rabbit
      - run: make test-load-headless

  load-dsl:
    name: DSL Load Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --locked --group test --extra sqlalchemy
      - run: make test-load-dsl

  audit:
    name: Nightly Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - run: make audit
